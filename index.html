<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · Tibisay ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="login-page">

  <main class="login-card">
    <div class="login-logo">
      <img src="assets/logo-tibisay.png" alt="Hoteles Tibisay">
      <h1>Hoteles Tibisay</h1>
      <p>Sistema de Gestión Hotelera</p>
    </div>

    <div class="login-demo">Demo: entra con cualquier usuario y contraseña</div>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="loginUser">Usuario</label>
        <input class="input" id="loginUser" type="text" placeholder="nombre.apellido" required>
      </div>
      <div class="field">
        <label for="loginPwd">Contraseña</label>
        <div class="pwd-wrap">
          <input class="input" id="loginPwd" type="password" placeholder="••••••••" required>
          <button class="icon-btn" type="button" id="togglePwd" aria-label="Mostrar contraseña" data-icon="eye"></button>
        </div>
      </div>
      <div class="field">
        <label for="loginProp">Propiedad</label>
        <select class="select" id="loginProp"></select>
      </div>
      <div class="login-row">
        <label><input type="checkbox" checked> Recordarme</label>
        <a href="#" data-toast="Se envió un enlace de recuperación (demo)">¿Olvidaste tu contraseña?</a>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
    </form>

    <div class="login-foot">© 2026 Hoteles Tibisay · v1.0 demo</div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
